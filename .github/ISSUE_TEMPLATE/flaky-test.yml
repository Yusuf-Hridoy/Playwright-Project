name: Flaky test
description: A test that passes and fails without the app or the test changing.
title: 'Flaky: '
labels: [flaky]
body:
  - type: markdown
    attributes:
      value: |
        While this is being looked at, tag the test `@quarantine`. It then runs
        in the quarantine project, where its result is shown but never turns
        the nightly run red. Remove the tag once it is steady again.

  - type: input
    id: test
    attributes:
      label: Which test
      description: The full title, as the report prints it.
      placeholder: Buying while the market is open > buying 5 KRYL takes the same cash in the summary, the message and the menu
    validations:
      required: true

  - type: dropdown
    id: project
    attributes:
      label: Which project
      options:
        - chromium
        - firefox
        - webkit
        - mobile
        - bug-hunt
        - drift
        - resilience
        - quarantine
        - setup
    validations:
      required: true

  - type: dropdown
    id: often
    attributes:
      label: How often it fails
      options:
        - Every few runs
        - About one run in ten
        - Rarely, but more than once
        - Only seen once so far
    validations:
      required: true

  - type: input
    id: run
    attributes:
      label: Link to a run that failed
      placeholder: https://github.com/Yusuf-Hridoy/Playwright-Project/actions/runs/...
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: The error
      description: Paste what the report said. No need to tidy it up.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: quarantined
    attributes:
      label: Before you file this
      options:
        - label: I have tagged the test `@quarantine` while it is being fixed.
