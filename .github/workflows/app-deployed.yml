# Runs the suite whenever a new build of Tradeloom goes live, and puts the
# result back on the app's commit as a check.
#
# Practice-App's notify-tests workflow sends the repository_dispatch. The same
# job can be started by hand with the two inputs below, which is how you test a
# preview deploy or re-run a commit.
name: app-deployed

on:
  repository_dispatch:
    types: [tradeloom-deployed]
  workflow_dispatch:
    inputs:
      base_url:
        description: Which copy of Tradeloom to test.
        required: false
        default: https://practiceapp-six.vercel.app
      app_sha:
        description: The Practice-App commit to put the check on. Leave empty for no check.
        required: false
        default: ''

# The check on the app's commit is written with APP_STATUS_TOKEN, which belongs
# to the other repo. Nothing in this one is written.
permissions:
  contents: read

# A newer deploy makes an older run pointless, so it cancels it.
concurrency:
  group: app-deployed
  cancel-in-progress: true

jobs:
  test:
    name: Test the live app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # From the app's dispatch when it was sent, from the form when started by
      # hand, and the live app when neither says otherwise.
      BASE_URL: ${{ github.event.client_payload.base_url || inputs.base_url || 'https://practiceapp-six.vercel.app' }}
      APP_SHA: ${{ github.event.client_payload.app_sha || inputs.app_sha || '' }}
      STATUS_CONTEXT: Playwright tests
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      APP_STATUS_TOKEN: ${{ secrets.APP_STATUS_TOKEN }}

    steps:
      - name: Say what is being tested
        run: echo "Testing ${BASE_URL} for Practice-App commit ${APP_SHA:-(none given)}."

      - name: Check out the tests
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mark the app's commit as pending
        if: env.APP_SHA != ''
        run: |
          set -euo pipefail
          .github/scripts/set-app-status.sh pending "Tests are running."

      # continue-on-error so the check below is always written. The last step
      # turns a failed run back into a failed job.
      - name: Run every Chromium test except the visual ones
        id: tests
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: npx playwright test --project=chromium --grep-invert @visual --reporter=list,html,json

      - name: Count what happened
        id: counts
        if: always()
        run: |
          set -euo pipefail
          node .github/scripts/summarise-results.js results.json >> "$GITHUB_OUTPUT"

      - name: Keep the report when something failed
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-app-deployed
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # Values reach the shell through the environment, never pasted into the
      # script text, so nothing a reporter prints can become a command.
      - name: Put the result on the app's commit
        if: always() && env.APP_SHA != ''
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          DESCRIPTION: ${{ steps.counts.outputs.description }}
        run: |
          set -euo pipefail
          if [ "${TEST_OUTCOME}" = "success" ]; then
            .github/scripts/set-app-status.sh success "${DESCRIPTION}"
          else
            .github/scripts/set-app-status.sh failure "${DESCRIPTION}"
          fi

      - name: Fail the job when a test failed
        if: steps.tests.outcome == 'failure'
        env:
          DESCRIPTION: ${{ steps.counts.outputs.description }}
        run: |
          echo "::error::${DESCRIPTION}"
          exit 1
