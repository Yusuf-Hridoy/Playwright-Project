# Full Regression — runs after merge to main/master (imple.md 3.1 + 3.2 + 3.6)
# Tests are sharded across 4 runners (--shard=1/4 style); per-shard blob
# reports are merged into a single HTML report. Flaky tests (pass on retry)
# are logged and uploaded for root-cause analysis.
name: Full Regression

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests (shard ${{ matrix.shard }}/4)
      run: npx playwright test --shard=${{ matrix.shard }}/4
    - name: Stage blob report (shard prefix avoids name collisions)
      if: ${{ !cancelled() }}
      run: |
        mkdir -p blobs
        i=0
        for f in blob-report/*.zip; do
          [ -e "$f" ] || continue
          i=$((i+1))
          cp "$f" "blobs/shard-${{ matrix.shard }}-$i.zip"
        done
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: blob-report-${{ matrix.shard }}
        path: blobs/
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results-${{ matrix.shard }}
        path: allure-results/
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: flaky-tests-${{ matrix.shard }}
        path: flaky-tests.txt
        if-no-files-found: ignore
        retention-days: 14

  merge-reports:
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Download blob reports
      uses: actions/download-artifact@v4
      with:
        pattern: blob-report-*
        merge-multiple: true
        path: all-blobs
    - name: Merge shards into a single HTML report
      run: npx playwright merge-reports --reporter html all-blobs
    - uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Download Allure results
      uses: actions/download-artifact@v4
      with:
        pattern: allure-results-*
        merge-multiple: true
        path: allure-results
    - name: Generate Allure Report
      run: |
        npm install -g allure-commandline
        allure generate allure-results --clean -o allure-report
    - uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
    - name: Download flaky test logs
      uses: actions/download-artifact@v4
      with:
        pattern: flaky-tests-*
        merge-multiple: true
        path: flaky-logs
    - uses: actions/upload-artifact@v4
      with:
        name: flaky-tests
        path: flaky-logs/
        if-no-files-found: ignore
        retention-days: 30
