# Nightly Full Regression — cron-triggered suite (imple.md 3.3)
# Runs the full @regression suite every night. Can also be triggered manually
# against a chosen environment.
name: Nightly Full Regression

on:
  schedule:
    # 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [dev, staging, prod]
        default: dev
        required: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Scheduled runs currently target the demo (dev) environment.
      # Switch to 'prod' once the real production URL is set in config.js.
      ENV: ${{ github.event.inputs.environment || 'dev' }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run nightly tests (shard ${{ matrix.shard }}/4)
      run: npm run test:regression -- --shard=${{ matrix.shard }}/4
    - name: Stage blob report (shard prefix avoids name collisions)
      if: ${{ !cancelled() }}
      run: |
        mkdir -p blobs
        i=0
        for f in blob-report/*.zip; do
          [ -e "$f" ] || continue
          i=$((i+1))
          cp "$f" "blobs/shard-${{ matrix.shard }}-$i.zip"
        done
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: blob-report-${{ matrix.shard }}
        path: blobs/
        retention-days: 7
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: flaky-tests-${{ matrix.shard }}
        path: flaky-tests.txt
        if-no-files-found: ignore
        retention-days: 7

  merge-reports:
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Download blob reports
      uses: actions/download-artifact@v4
      with:
        pattern: blob-report-*
        merge-multiple: true
        path: all-blobs
    - name: Merge shards into a single HTML report
      run: npx playwright merge-reports --reporter html all-blobs
    - uses: actions/upload-artifact@v4
      with:
        name: nightly-playwright-report
        path: playwright-report/
        retention-days: 14
    - name: Download flaky test logs
      uses: actions/download-artifact@v4
      with:
        pattern: flaky-tests-*
        merge-multiple: true
        path: flaky-logs
    - uses: actions/upload-artifact@v4
      with:
        name: nightly-flaky-tests
        path: flaky-logs/
        if-no-files-found: ignore
        retention-days: 14
