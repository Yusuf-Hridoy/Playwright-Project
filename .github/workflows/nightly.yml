# The full run: every project, every browser, every night.
#
# The work is split over three shards so it finishes in a third of the time.
# Each shard writes a blob report, a second job glues those back into one HTML
# report, and a third job publishes that report to GitHub Pages.
name: nightly

on:
  schedule:
    # 20:00 UTC, which is 02:00 in Dhaka.
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  test:
    name: Shard ${{ matrix.shard }} of 3
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      # One slow browser must not take the other shards down with it.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out the tests
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install the dependencies
        run: npm ci

      # Every browser this time: the nightly run is the one that covers
      # Firefox, WebKit and the phone project.
      - name: Install every browser
        run: npx playwright install --with-deps

      # Every project but quarantine. A quarantined test still runs, in the
      # job below, where its result cannot turn this run red.
      - name: Run shard ${{ matrix.shard }}
        run: npx playwright test --shard=${{ matrix.shard }}/3 --reporter=blob --grep-invert "@quarantine"

      - name: Keep this shard's blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14
          if-no-files-found: ignore

  merge:
    name: Merge the reports
    needs: test
    # The report is most useful on the night something broke, so it is built
    # whether the shards passed or not.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # This job only reads the repository. Writing to Pages is the publish
    # job's work, and its token is the only one that can do it.
    permissions:
      contents: read

    steps:
      - name: Check out the tests
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Collect every shard's blob report
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # The three Phase 5 reporters run here, not in the shards, so the bug
      # hunt score, the heal report and the flaky list each cover all three
      # shards at once instead of a third of the run apiece.
      - name: Glue them into one HTML report
        run: npx playwright merge-reports --reporter "html,./reporters/bug-hunt-reporter.ts,./reporters/heal-reporter.ts,./reporters/flaky-reporter.ts" ./all-blob-reports

      - name: Keep the heal report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heal-report-nightly
          path: heal-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the flaky list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-report-nightly
          path: flaky-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the merged report when a shard failed
        if: needs.test.result != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nightly
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Set GitHub Pages up
        uses: actions/configure-pages@v6

      - name: Hand the report to Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report

  # Parked tests, on their own, where their result is shown but never counted.
  # continue-on-error keeps a red quarantine run from turning the night red:
  # that is the whole point of parking a test instead of deleting it.
  quarantine:
    name: Quarantined tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out the tests
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the quarantined tests
        continue-on-error: true
        run: npm run test:quarantine

  publish:
    name: Publish the report to Pages
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The only job that may write to Pages, and the only one that asks for an
    # OIDC token, which is what Pages uses to trust the deploy.
    permissions:
      pages: write
      id-token: write

    # GitHub shows the published address against this environment once the
    # deploy step reports it.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Publish it
        id: deploy
        uses: actions/deploy-pages@v5
