# The full run: every project, every browser, every night.
#
# The work is split over three shards so it finishes in a third of the time.
# Each shard writes a blob report, a second job glues those back into one HTML
# report, and a third job publishes that report to GitHub Pages.
name: nightly

on:
  schedule:
    # 20:00 UTC, which is 02:00 in Dhaka.
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # The one place the Playwright version is read. See checks.yml.
  version:
    name: Work out the Playwright image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.read.outputs.image }}
    steps:
      - name: Check out the tests
        uses: actions/checkout@v7

      - name: Read the Playwright version from package.json
        id: read
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').devDependencies['@playwright/test']")"
          echo "Playwright is $version"
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  test:
    name: Shard ${{ matrix.shard }} of 3
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      image: ${{ needs.version.outputs.image }}

    env:
      HOME: /root

    strategy:
      # One slow browser must not take the other shards down with it.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out the tests
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install the dependencies
        run: npm ci

      # Every project but quarantine. A quarantined test still runs, in the
      # job below, where its result cannot turn this run red.
      - name: Run shard ${{ matrix.shard }}
        run: npx playwright test --shard=${{ matrix.shard }}/3 --reporter=blob --grep-invert "@quarantine"

      - name: Keep this shard's blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14
          if-no-files-found: ignore

  merge:
    name: Merge the reports
    needs: [version, test]
    # The report is most useful on the night something broke, so it is built
    # whether the shards passed or not.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20

    container:
      image: ${{ needs.version.outputs.image }}

    env:
      HOME: /root

    # This job only reads the repository. Writing to Pages is the publish
    # job's work, and its token is the only one that can do it.
    permissions:
      contents: read

    steps:
      - name: Check out the tests
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Collect every shard's blob report
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # The three Phase 5 reporters run here, not in the shards, so the bug
      # hunt score, the heal report and the flaky list each cover all three
      # shards at once instead of a third of the run apiece.
      - name: Glue them into one HTML report
        run: npx playwright merge-reports --reporter "html,./reporters/bug-hunt-reporter.ts,./reporters/heal-reporter.ts,./reporters/flaky-reporter.ts" ./all-blob-reports

      # The same blobs again, this time as one results file, which is what the
      # history script counts tonight's numbers and slowest tests from.
      - name: Merge them again as one results file
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: nightly-results.json
        run: npx playwright merge-reports --reporter json ./all-blob-reports

      # Last night's history, taken from the page this run is about to
      # replace. A 404 on the first night is fine: the history starts tonight.
      - name: Fetch last night's history
        run: |
          set -euo pipefail
          if curl -fsSL -o history.json 'https://yusuf-hridoy.github.io/Playwright-Project/history.json'; then
            echo "Got last night's history."
          else
            echo 'Nothing published yet. Starting a new history.'
            rm -f history.json
          fi

      # Writes history.json and history.html next to the report, so both go to
      # Pages together, and tonight's numbers into the job summary.
      - name: Add tonight to the history
        run: node scripts/nightly-history.mjs --results nightly-results.json --previous history.json --out playwright-report

      - name: Keep the heal report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heal-report-nightly
          path: heal-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the flaky list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-report-nightly
          path: flaky-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the merged report when a shard failed
        if: needs.test.result != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nightly
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Set GitHub Pages up
        uses: actions/configure-pages@v6

      - name: Hand the report to Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report

  # Parked tests, on their own, where their result is shown but never counted.
  # continue-on-error keeps a red quarantine run from turning the night red:
  # that is the whole point of parking a test instead of deleting it.
  quarantine:
    name: Quarantined tests
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20

    container:
      image: ${{ needs.version.outputs.image }}

    env:
      HOME: /root

    permissions:
      contents: read

    steps:
      - name: Check out the tests
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Run the quarantined tests
        continue-on-error: true
        run: npm run test:quarantine

  publish:
    name: Publish the report to Pages
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The only job that may write to Pages, and the only one that asks for an
    # OIDC token, which is what Pages uses to trust the deploy. It runs no
    # tests, so it needs no browser and no container.
    permissions:
      pages: write
      id-token: write

    # GitHub shows the published address against this environment once the
    # deploy step reports it.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Publish it
        id: deploy
        uses: actions/deploy-pages@v5
