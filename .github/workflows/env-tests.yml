# Environment-Specific Tests — dev / staging / prod (imple.md 3.7)
# Triggered manually from the Actions tab, or via repository_dispatch
# (event type: run-env-tests) with an "environment" (and optional "suite")
# key in the client payload.
name: Environment Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [dev, staging, prod]
        default: dev
        required: true
      suite:
        description: 'Test suite to run'
        type: choice
        options: [smoke, regression]
        default: regression
        required: true
  repository_dispatch:
    types: [run-env-tests]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      ENV: ${{ github.event.inputs.environment || github.event.client_payload.environment || 'dev' }}
      SUITE: ${{ github.event.inputs.suite || github.event.client_payload.suite || 'regression' }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run ${{ env.SUITE }} tests against ${{ env.ENV }}
      run: npx playwright test --grep @${{ env.SUITE }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ env.ENV }}-${{ env.SUITE }}
        path: playwright-report/
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: flaky-tests-${{ env.ENV }}-${{ env.SUITE }}
        path: flaky-tests.txt
        if-no-files-found: ignore
        retention-days: 14
