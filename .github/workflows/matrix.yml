# Compatibility Matrix — OS x Node version builds (imple.md 3.5)
# Runs the @smoke suite across Ubuntu/Windows/macOS and Node LTS versions
# to catch environment-specific issues. Triggered on push and manually.
name: Compatibility Matrix

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  smoke-matrix:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers (Linux)
      if: runner.os == 'Linux'
      run: npx playwright install --with-deps
    - name: Install Playwright Browsers (Windows/macOS)
      if: runner.os != 'Linux'
      run: npx playwright install
    - name: Run smoke tests (${{ matrix.os }} / Node ${{ matrix.node-version }})
      run: npm run test:smoke
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.os }}-node${{ matrix.node-version }}
        path: playwright-report/
        retention-days: 14
