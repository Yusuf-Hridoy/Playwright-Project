# The quick gate on every change to this repo: does it compile, and do the
# main journeys still work against the live app?
name: checks

on:
  push:
    branches: [main]
  pull_request:

# Nothing is written anywhere. The job only reads this repo.
permissions:
  contents: read

# A second push to the same branch makes the first one pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the tests
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Only the browser this job uses. Firefox and WebKit belong to nightly.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the smoke tests against the live app
        run: npx playwright test --project=chromium --grep @smoke

      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-checks
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
