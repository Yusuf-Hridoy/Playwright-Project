# The quick gate on every change to this repo: does it lint, is it formatted,
# is every test tagged, does it compile, and do the main journeys still work
# against the live app?
name: checks

on:
  push:
    branches: [main]
  pull_request:

# Nothing is written anywhere. The job only reads this repo.
permissions:
  contents: read

# A second push to the same branch makes the first one pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The one place the Playwright version is read. Every job below runs inside
  # the image this prints, so a Dependabot bump of @playwright/test moves the
  # image with it and there is nothing to edit by hand.
  version:
    name: Work out the Playwright image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.read.outputs.image }}
    steps:
      - name: Check out the tests
        uses: actions/checkout@v7

      - name: Read the Playwright version from package.json
        id: read
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').devDependencies['@playwright/test']")"
          echo "Playwright is $version"
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  checks:
    name: Lint, typecheck and smoke tests
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Every browser is already installed in this image, at the version that
    # matches @playwright/test.
    container:
      image: ${{ needs.version.outputs.image }}

    env:
      # What Playwright's own documentation asks for, so Firefox can write to
      # a home directory inside the container.
      HOME: /root

    steps:
      - name: Check out the tests
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check the formatting
        run: npm run format:check

      - name: Check that every test is tagged
        run: node scripts/check-test-tags.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Run the smoke tests against the live app
        run: npx playwright test --project=chromium --grep @smoke

      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-checks
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
